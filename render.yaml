services:
  - type: web
    name: settleup-backend
    env: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    region: oregon
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_URL
        fromDatabase:
          name: settleup-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: settleup-redis
          property: connectionString
      - key: REDIS_HOST
        fromService:
          type: redis
          name: settleup-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: redis
          name: settleup-redis
          property: port
      - key: JWT_SECRET
        generateValue: true
      - key: JPA_DDL_AUTO
        value: update
      - key: SEED_DEMO_DATA
        value: "true"

  - type: redis
    name: settleup-redis
    region: oregon
    plan: free
    ipAllowList: []

databases:
  - name: settleup-db
    databaseName: settleup
    user: settleup
    region: oregon
    plan: free
