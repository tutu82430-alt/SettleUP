spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/settleup
    username: settleup
    password: settleup_secret
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: localhost
      port: 6379
      url: redis://localhost:6379
  cache:
    type: redis

app:
  seed-demo-data: false
  jwt:
    secret: TestSecretKeyForJWTSigningWith256BitsMinimumLengthRequired!!
    expiration-ms: 3600000
